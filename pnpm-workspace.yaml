packages:
  - apps/*
  - packages/*

overrides:
  "@types/minimatch": 5.1.2
  eslint: "^9.39.3"
  sanitize-html: 2.17.4
  handlebars: 4.7.10
  shell-quote: 1.11.0
  websocket-driver: 0.7.5
  tar: 7.5.19
  proxy-addr: 2.0.8
  tinypool: 2.1.2
  dompurify: 3.4.17
  git-diff: 2.0.7

hoistPattern:
  - "*"
  - "!@strapi/*"

onlyBuiltDependencies:
  - "@apollo/protobufjs"
  - "@parcel/watcher"
  - "@scarf/scarf"
  - "@strapi/strapi"
  - "@swc/core"
  - better-sqlite3
  - core-js
  - core-js-pure
  - esbuild
  - puppeteer
  - sharp
  - unrs-resolver

publicHoistPattern:
  - "*"
  - "!@strapi/*"
